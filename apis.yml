name: Jive
description: 'Jive (marketed today as "Jive AI" and owned by IgniteTech, an ESW Capital
  company based in Austin, Texas) is an enterprise collaboration and communication
  platform — a digital workplace that unifies people, knowledge, and content across
  departments and locations for large, often regulated organizations. Capabilities
  include collaboration spaces and group discussions, knowledge management with
  search and co-editing, personalized role-based news feeds, mobile and desktop
  apps, and engagement analytics. Jive originated as a venture-backed (Kleiner
  Perkins) enterprise-social vendor that IPO''d in 2011 and shipped a REST API plus
  an official Node.js add-on SDK. It was later acquired into the Aurea / ESW Capital
  / IgniteTech family.'
